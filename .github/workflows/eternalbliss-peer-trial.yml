name: EternalBliss candidate peer trial
on:
  push:
    branches: [automation/eternalbliss-release-candidate]
permissions:
  contents: read
jobs:
  trial:
    if: "contains(github.event.head_commit.message, '[run peer trial]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare isolated browser
        run: |
          npm install --prefix /tmp/eb-playwright --no-audit --no-fund playwright@1.56.1
          /tmp/eb-playwright/node_modules/.bin/playwright install --with-deps chromium
          echo NODE_PATH=/tmp/eb-playwright/node_modules >> "$GITHUB_ENV"
      - name: Measure public Devnet peers
        env:
          EB_EVIDENCE: ${{ runner.temp }}/peer-evidence
          EB_PUBLIC_TRIAL: '1'
        run: |
          node eternalbliss/tests/release/public-peer-profile.cjs eternalbliss/index.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-peer-timings
          path: ${{ runner.temp }}/peer-evidence/
