name: EternalBliss regression monitor
on:
  push:
    branches:
      - automation/eternalbliss-release-candidate
      - automation/eternalbliss-codex
  pull_request:
    paths:
      - 'eternalbliss/**'
      - '.github/workflows/eternalbliss-monitor.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: eternalbliss-monitor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contracts:
    name: Source and regression contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify inline scripts, geography, and source contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          sha256sum eternalbliss/index.html | tee artifacts/html-sha256.txt
          node eternalbliss/tests/automation-audit.cjs eternalbliss/index.html > artifacts/geography.json
          node eternalbliss/tests/automation-quests.cjs <(git show 76664bfa954062cf15de7b63d21edb26d44e7847:eternalbliss/index.html) > artifacts/quests.log
          node - <<'NODE' | tee artifacts/inline-scripts.log
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const html=fs.readFileSync('eternalbliss/index.html','utf8');
          const scripts=[...html.matchAll(/<script\b[^>]*data-source="([^"]+)"[^>]*>([\s\S]*?)<\/script>/g)];
          assert(scripts.length>=30,'Expected >=30 named inline scripts');
          for(const [,name,body] of scripts) new vm.Script(body,{filename:name});
          console.log('PASS inline JavaScript syntax:',scripts.length,'scripts');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eternalbliss-source-contracts
          path: artifacts/
          retention-days: 14

  browser-smoke:
    name: Chromium browser smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Playwright and Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/eb-playwright
          npm install --prefix /tmp/eb-playwright --no-save --no-audit --no-fund playwright@1.56.1
          /tmp/eb-playwright/node_modules/.bin/playwright install --with-deps chromium
          echo "NODE_PATH=/tmp/eb-playwright/node_modules" >> "$GITHUB_ENV"
          CHROME="$(NODE_PATH=/tmp/eb-playwright/node_modules node -p "require('playwright').chromium.executablePath()")"
          test -x "$CHROME"
          echo "EB_CHROMIUM_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Start isolated local server
        run: |
          python3 -m http.server 8091 --bind 127.0.0.1 >/tmp/eb-http.log 2>&1 &
          echo $! >/tmp/eb-http.pid
          sleep 2
          curl -fsS http://127.0.0.1:8091/eternalbliss/ >/dev/null
      - name: Browser checks
        shell: bash
        env:
          EB_EVIDENCE: ${{ runner.temp }}/eternalbliss-evidence
        run: |
          set -euo pipefail
          mkdir -p "$EB_EVIDENCE"
          node eternalbliss/tests/automation-save-version.cjs
          node eternalbliss/tests/coastal-boarding.cjs
          EB_VEHICLE_CASE=desktop node eternalbliss/tests/release/vehicles.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eternalbliss-browser-evidence
          path: ${{ runner.temp }}/eternalbliss-evidence/
          retention-days: 14

  report:
    name: Publish regression status
    if: always()
    needs: [source-contracts, browser-smoke]
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Add run summary
        env:
          SOURCE_RESULT: ${{ needs.source-contracts.result }}
          BROWSER_RESULT: ${{ needs.browser-smoke.result }}
        run: |
          {
            echo '## EternalBliss automated regression'
            echo ''
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Source contracts: $SOURCE_RESULT"
            echo "- Browser smoke: $BROWSER_RESULT"
            echo '- Development only; no deployment, merge or Codex execution.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Comment on issue 29 only for failures
        if: github.event_name != 'pull_request' && (needs.source-contracts.result == 'failure' || needs.browser-smoke.result == 'failure')
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const sha=context.sha.slice(0,12);
            const url=`${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body=`Automated EternalBliss regression failed on \`${sha}\`. [View run and evidence](${url}). Source contracts: ${{ toJSON(needs.source-contracts.result) }}; browser smoke: ${{ toJSON(needs.browser-smoke.result) }}. No merge or deployment was performed.`;
            await github.rest.issues.createComment({owner,repo,issue_number:29,body});
