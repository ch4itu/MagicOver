name: EternalBliss mounted travel
on:
  push:
    branches: [automation/eternalbliss-release-candidate]
permissions:
  contents: read
jobs:
  trial:
    if: "contains(github.event.head_commit.message, '[profile mount]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare isolated browser
        run: |
          npm install --prefix /tmp/eb-playwright --no-audit --no-fund playwright@1.56.1
          /tmp/eb-playwright/node_modules/.bin/playwright install --with-deps chromium
          echo NODE_PATH=/tmp/eb-playwright/node_modules >> "$GITHUB_ENV"
      - name: Measure mounted travel
        env:
          EB_EVIDENCE: ${{ runner.temp }}/ride
        run: |
          export EB_CHROMIUM_PATH=$(node -p "require('playwright').chromium.executablePath()")
          mkdir -p "$EB_EVIDENCE"
          git show 135fa99ad8853ac522c1e41fb75d98829735a5d2:eternalbliss/index.html >/tmp/ride-v15.html
          for round in 1 2; do
            order="new old"
            if test "$round" = 2; then order="old new"; fi
            for build in $order; do
              export EB_SOURCE=eternalbliss/index.html EB_RIDE_EXPECT_FIX=1 EB_RIDE_ROUND=$round
              if test "$build" = old; then export EB_SOURCE=/tmp/ride-v15.html EB_RIDE_EXPECT_FIX=0; fi
              for mode in 2d overhead first; do
                EB_RIDE_VIEW=$mode node eternalbliss/tests/release/mounted-travel.cjs
              done
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mounted-travel
          path: ${{ runner.temp }}/ride/
      - name: Check the final candidate
        env:
          EB_EVIDENCE: ${{ runner.temp }}/release
          EB_SCOPE_LIVING_REST: '1'
          EB_SCOPE_BASELINE: /tmp/ride-v15.html
          EB_QUEST_BASELINE: /tmp/eb-quest.html
          EB_ARCHITECTURE_BASELINE: /tmp/eb-arch.html
          EB_ROLLBACK_SOURCE: /tmp/eb-rollback.html
        run: |
          git show 76664bf:eternalbliss/index.html > "$EB_QUEST_BASELINE"
          git show 12ecd8d:eternalbliss/index.html > "$EB_ARCHITECTURE_BASELINE"
          git show 047b3c9:eternalbliss/index.html > "$EB_ROLLBACK_SOURCE"
          export EB_RC_CANDIDATE=$(sha256sum eternalbliss/index.html | cut -d' ' -f1)
          export EB_CHROMIUM_PATH=$(node -p "require('playwright').chromium.executablePath()")
          python3 -m http.server 8091 --bind 127.0.0.1 >/tmp/eb-http.log 2>&1 &
          node eternalbliss/tests/release/long-frame.cjs
          node eternalbliss/tests/clean-room-exit.cjs
          node eternalbliss/tests/release/pr30-matrix.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mount-release
          path: ${{ runner.temp }}/release/
