[package]
name = "smaran_streaks"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Smaran Streaks: a daily habit check-in for Smaran usernames on MagicBlock's devnet rollup."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
solana-compiler-builtins = "=0.3.0"

[profile.release]
overflow-checks = true
codegen-units = 1
opt-level = 3
lto = true

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[workspace]
