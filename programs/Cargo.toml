[workspace]
members = ["game", "registry", "leaderboard", "ludo"]
resolver = "2"

[workspace.dependencies]
solana-compiler-builtins = "=0.3.0"

[profile.release]
overflow-checks = true
codegen-units = 1
opt-level = 3
lto = true

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
